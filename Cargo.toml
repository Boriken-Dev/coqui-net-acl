[package]
name = "coqui-net-acl"
version = "0.0.0-alpha.0"
description = "Ordered, first-match access control lists over source networks, with pre-read and post-handshake evaluation"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-net-acl"
homepage = "https://boriken-dev.github.io/coqui-net-acl/"
keywords = ["acl", "access-control", "firewall", "cidr", "network"]
categories = ["network-programming"]
exclude = [".*", "*.local.*", "/tools/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Serde support with a plain text form (CIDR strings, `permit` / `deny`).
serde = ["dep:serde"]
# `Acl`, `Rule` and `Action` described field by field, read from text through `coqui_builder::Partial`.
describe = ["dep:coqui-builder"]

[dependencies]
# The text form, behind the `serde` feature.
serde = { version = "1", default-features = false, features = ["derive", "std"], optional = true }
# The description of the list, behind `describe`; alpha, by revision, as the family pins it.
coqui-builder = { git = "https://github.com/Boriken-Dev/coqui-builder", rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
# Reads the text form in tests.
toml = "0.9"
# Reads the list into a `Partial` in tests.
coqui-builder = { git = "https://github.com/Boriken-Dev/coqui-builder", rev = "c1875f8276bd6366c38e9133fdb1181a0ffbaaad", default-features = false, features = ["derive", "serde"] }
