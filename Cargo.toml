[package]
name = "coqui-net-acl"
version = "0.0.0-alpha.0"
description = "Ordered, first-match access control lists over source networks, with pre-read and post-handshake evaluation"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-net-acl"
homepage = "https://boriken-dev.github.io/coqui-net-acl/"
keywords = ["acl", "access-control", "firewall", "cidr", "network"]
categories = ["network-programming"]
exclude = [".*", "*.local.*", "/tools/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Serde support with a plain text form (CIDR strings, `permit` / `deny`).
serde = ["dep:serde"]
# `Acl`, `Rule` and `Action` as guatiao values with a schema, read and written as TOML, JSON or YAML
# through `guatiao-serde`.
guatiao = ["dep:guatiao"]

[dependencies]
# The text form, behind the `serde` feature.
serde = { version = "1", default-features = false, features = ["derive", "std"], optional = true }
# The value form of the list, behind `guatiao`; alpha, by revision, as the family pins it.
guatiao = { git = "https://github.com/Boriken-Dev/guatiao", rev = "03e1cac8be06715a8037f45f1610c5894eea0b5b", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
# Reads the text form in tests.
toml = "0.9"
# The text forms of the guatiao value in tests.
guatiao-serde = { git = "https://github.com/Boriken-Dev/guatiao", rev = "03e1cac8be06715a8037f45f1610c5894eea0b5b", default-features = false, features = ["json", "toml", "yaml"] }
