[package]
name = "coqui-net-acl"
version = "0.0.0-alpha.0"
description = "Ordered, first-match access control lists over source networks, with pre-read and post-handshake evaluation"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-net-acl"
homepage = "https://boriken-dev.github.io/coqui-net-acl/"
keywords = ["acl", "access-control", "firewall", "cidr", "network"]
categories = ["network-programming"]
exclude = [".*", "*.local.*"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Serde support with a plain text form (CIDR strings, `permit` / `deny`).
serde = ["dep:serde"]

[dependencies]
# The text form, behind the `serde` feature.
serde = { version = "1", default-features = false, features = ["derive", "std"], optional = true }

[dev-dependencies]
# Reads the text form in tests.
toml = "0.9"
